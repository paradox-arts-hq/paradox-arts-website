<!DOCTYPE html>
<html lang="en">
<head>

<style>
  /* Served for any missing address, so every path here starts at the site root ("/"). */
  @font-face{ font-family:'Archivo'; src:url('/fonts/archivo-latin.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  :root{ --navy:#161B33; --cream:#F1DAC4; --orange:#CC5500; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    min-height:100%; display:grid; place-items:center; padding:48px 20px;
    background:var(--navy); color:var(--cream);
    font-family:'Archivo', Arial, Helvetica, sans-serif;
    background-image:linear-gradient(rgba(241,218,196,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(241,218,196,.06) 1px, transparent 1px);
    background-size:34px 34px;
  }
  main{ width:100%; max-width:640px; }
  .mark{ display:block; width:54px; height:auto; margin-bottom:40px; }
  .eyebrow{ font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; opacity:.8; }
  h1{ margin-top:18px; font-size:clamp(40px, 8vw, 72px); font-weight:800; line-height:.98; letter-spacing:-.02em; text-transform:uppercase; }
  h1 span{ color:#FF7A33; }
  p{ margin-top:24px; max-width:460px; font-size:16px; line-height:1.65; opacity:.85; }
  .actions{ margin-top:36px; display:flex; flex-wrap:wrap; gap:14px; }
  .btn{
    display:inline-flex; align-items:center; padding:15px 24px; border:2px solid var(--cream);
    color:var(--cream); text-decoration:none; font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .btn--solid{ background:var(--cream); color:var(--navy); }
  .btn:hover{ background:var(--orange); border-color:var(--orange); color:#000; }
  .btn:focus-visible{ outline:3px solid #FF7A33; outline-offset:3px; }
  .foot{ margin-top:56px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.7; }
  .foot a{ color:inherit; }
  @media (prefers-reduced-motion: reduce){ .btn{ transition:none; } }
</style>
</head>
<body>
<main>
  <img class="mark" src="/logo/logo-mark-cream.png" alt="Paradox Arts" width="107" height="160">

  <div class="foot">Paradox Arts · Lagos, Nigeria · <a href="mailto:hq.paradoxarts@gmail.com">hq.paradoxarts@gmail.com</a></div>
</main>
</body>
